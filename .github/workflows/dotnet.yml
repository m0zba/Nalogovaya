name: Nalogovaya CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Nalogovaya.sln

      - name: Build solution
        run: dotnet build Nalogovaya.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test Nalogovaya.Tests/Nalogovaya.Tests.csproj --configuration Release --no-build
